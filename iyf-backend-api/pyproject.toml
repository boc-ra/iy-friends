[project]
name = "iyf-backend-api"
version = "0.1.0"
description = "IY Friends backend API (modular monolith on AWS Lambda) — Phase 1"
requires-python = ">=3.13"

# 依存はバージョン固定（SECURITY-10: dependency pinning）。
# 本番デプロイ時はロックファイル（requirements.txt / hashes）で再現性を担保する。
dependencies = [
    "boto3==1.43.81",
    "pydantic==2.13.4",
    "email-validator==2.3.0",
    "bleach==6.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.165.10",
    "moto[dynamodb]==5.2.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["src"]
